name: generate

on:
  push:
    branches:
      - dev

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          cody-app-id: ${{ vars.CODY_APP_ID }}
          cody-app-secret: ${{ secrets.CODY_APP_SECRET }}

      - name: Generate OpenAPI
        run: bun dev generate > ../sdk/openapi.json
        working-directory: packages/codyx

      - name: Build JS SDK
        run: bun ./packages/sdk/js/script/build.ts
        env:
          CODY_SDK_OPENAPI_FILE: ${{ github.workspace }}/packages/sdk/openapi.json

      - name: Format generated output
        run: bun prettier --write packages/sdk/openapi.json packages/sdk/js/src/gen packages/sdk/js/src/v2

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore: generate" --allow-empty
          git push origin HEAD:${{ github.ref_name }} --no-verify
          # if ! git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }} --no-verify; then
          #   echo ""
          #   echo "============================================"
          #   echo "Failed to push generated code."
          #   echo "Please run locally and push:"
          #   echo ""
          #   echo "  bun ./script/generate.ts"
          #   echo "  git add -A && git commit -m \"chore: generate\" && git push"
