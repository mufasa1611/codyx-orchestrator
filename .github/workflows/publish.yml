name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-24.04
    if: github.repository == 'mufasa1611/codyx-orchestrator'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Install codyx-ai
        if: inputs.bump || inputs.version
        run: bun i -g codyx-ai

      - id: version
        run: |
          bun ./script/version.ts
        env:
          GH_TOKEN: ${{ github.token }}
          CODY_BUMP: ${{ inputs.bump }}
          CODY_VERSION: ${{ inputs.version }}
          CODY_API_KEY: ${{ secrets.CODY_API_KEY }}
          GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: ubuntu-24.04
    if: github.repository == 'mufasa1611/codyx-orchestrator'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          cody-app-id: ${{ vars.CODY_APP_ID }}
          cody-app-secret: ${{ secrets.CODY_APP_SECRET }}

      - name: Build
        id: build
        run: |
          bun ./packages/codyx/script/build.ts --all ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
        env:
          CODY_VERSION: ${{ needs.version.outputs.version }}
          CODY_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: cody-cli-windows
          path: packages/codyx/dist/codyx-ai-windows*
    outputs:
      version: ${{ needs.version.outputs.version }}

  sign-cli-windows:
    needs:
      - build-cli
      - version
    runs-on: windows-2025
    if: github.repository == 'mufasa1611/codyx-orchestrator'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: cody-cli-windows
          path: packages/codyx/dist

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          cody-app-id: ${{ vars.CODY_APP_ID }}
          cody-app-secret: ${{ secrets.CODY_APP_SECRET }}

      - name: Azure login
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@v1
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' && env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != '' && env.AZURE_TRUSTED_SIGNING_ENDPOINT != ''
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\packages\codyx\dist\codyx-ai-windows-arm64\bin\codyx.exe
            ${{ github.workspace }}\packages\codyx\dist\codyx-ai-windows-x64\bin\codyx.exe
            ${{ github.workspace }}\packages\codyx\dist\codyx-ai-windows-x64-baseline\bin\codyx.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows CLI signatures
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' && env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != '' && env.AZURE_TRUSTED_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\codyx\dist\codyx-ai-windows-arm64\bin\codyx.exe",
            "${{ github.workspace }}\packages\codyx\dist\codyx-ai-windows-x64\bin\codyx.exe",
            "${{ github.workspace }}\packages\codyx\dist\codyx-ai-windows-x64-baseline\bin\codyx.exe"
          )

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - name: Repack Windows CLI archives
        working-directory: packages/codyx/dist
        shell: pwsh
        run: |
          Compress-Archive -Path "codyx-ai-windows-arm64\bin\*" -DestinationPath "codyx-ai-windows-arm64.zip" -Force
          Compress-Archive -Path "codyx-ai-windows-x64\bin\*" -DestinationPath "codyx-ai-windows-x64.zip" -Force
          Compress-Archive -Path "codyx-ai-windows-x64-baseline\bin\*" -DestinationPath "codyx-ai-windows-x64-baseline.zip" -Force

      - name: Upload signed Windows CLI release assets
        if: needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" `
            "${{ github.workspace }}\packages\codyx\dist\codyx-ai-windows-arm64.zip" `
            "${{ github.workspace }}\packages\codyx\dist\codyx-ai-windows-x64.zip" `
            "${{ github.workspace }}\packages\codyx\dist\codyx-ai-windows-x64-baseline.zip" `
            --clobber `
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cody-cli-signed-windows
          path: packages/codyx/dist/codyx-ai-windows-*

  build-launcher-windows:
    needs:
      - version
    runs-on: windows-2025
    if: github.repository == 'mufasa1611/codyx-orchestrator'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          cody-app-id: ${{ vars.CODY_APP_ID }}
          cody-app-secret: ${{ secrets.CODY_APP_SECRET }}

      - name: Azure login
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build launcher exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          dotnet publish packages\launcher\Codyx.Launcher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o dist\launcher
          Copy-Item dist\launcher\Codyx.Launcher.exe dist\codyx-launcher-windows-x64.exe -Force

      - name: Sign launcher exe
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File script\sign-windows.ps1 dist\codyx-launcher-windows-x64.exe

      - name: Verify launcher signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\codyx-launcher-windows-x64.exe
          if ($env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME -and $sig.Status -ne "Valid") {
            throw "Invalid signature for launcher: $($sig.Status)"
          }

      - name: Upload launcher release asset
        if: needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: gh release upload "v${{ needs.version.outputs.version }}" dist\codyx-launcher-windows-x64.exe --clobber --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@v4
        with:
          name: codyx-launcher-windows
          path: dist/codyx-launcher-windows-x64.exe

  build-end-user-installer-windows:
    needs:
      - version
    runs-on: windows-2025
    if: github.repository == 'mufasa1611/codyx-orchestrator'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          cody-app-id: ${{ vars.CODY_APP_ID }}
          cody-app-secret: ${{ secrets.CODY_APP_SECRET }}

      - name: Azure login
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build compiled-assets installer exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          dotnet publish packages\end-user-installer\Codyx.EndUserInstaller.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o dist\end-user-installer
          Copy-Item dist\end-user-installer\Codyx.EndUserInstaller.exe dist\codyx-end-user-installer-windows-x64.exe -Force

      - name: Sign compiled-assets installer exe
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File script\sign-windows.ps1 dist\codyx-end-user-installer-windows-x64.exe

      - name: Verify compiled-assets installer signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\codyx-end-user-installer-windows-x64.exe
          if ($env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME -and $sig.Status -ne "Valid") {
            throw "Invalid signature for compiled-assets installer: $($sig.Status)"
          }

      - name: Upload compiled-assets installer release asset
        if: needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: gh release upload "v${{ needs.version.outputs.version }}" dist\codyx-end-user-installer-windows-x64.exe --clobber --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@v4
        with:
          name: codyx-end-user-installer-windows
          path: dist/codyx-end-user-installer-windows-x64.exe

  publish:
    needs:
      - version
      - build-cli
      - sign-cli-windows
      - build-launcher-windows
      - build-end-user-installer-windows
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@v4
        with:
          name: cody-cli-windows
          path: packages/codyx/dist

      - uses: actions/download-artifact@v4
        with:
          name: cody-cli-signed-windows
          path: packages/codyx/dist

      - uses: actions/download-artifact@v4
        with:
          name: codyx-launcher-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: codyx-end-user-installer-windows
          path: dist

      - name: Generate release manifest
        if: needs.version.outputs.release != ''
        run: bun ./script/create-release-manifest.ts
        env:
          CODY_VERSION: ${{ needs.version.outputs.version }}
          CODY_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          GH_REPO: ${{ needs.version.outputs.repo }}

      - name: Upload release manifest
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.version.outputs.version }}" dist/codyx-release-manifest.json --clobber --repo "${{ needs.version.outputs.repo }}"
