name: "Setup Git Committer"
description: "Create app token and configure git user"
inputs:
  cody-app-id:
    description: "Cody GitHub App ID"
    required: false
  cody-app-secret:
    description: "Cody GitHub App private key"
    required: false
outputs:
  token:
    description: "GitHub token"
    value: ${{ steps.token.outputs.token }}
  app-slug:
    description: "GitHub App slug or fallback bot name"
    value: ${{ steps.token.outputs.app-slug }}
runs:
  using: "composite"
  steps:
    - name: Create app token
      id: apptoken
      if: ${{ inputs.cody-app-id != '' && inputs.cody-app-secret != '' }}
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.cody-app-id }}
        private-key: ${{ inputs.cody-app-secret }}
        owner: ${{ github.repository_owner }}

    - name: Select git token
      id: token
      env:
        APP_SLUG: ${{ steps.apptoken.outputs.app-slug }}
        APP_TOKEN: ${{ steps.apptoken.outputs.token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [ -n "$APP_TOKEN" ]; then
          echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          echo "app-slug=$APP_SLUG" >> "$GITHUB_OUTPUT"
          echo "user-name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "user-email=${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "token=$GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
        echo "app-slug=github-actions" >> "$GITHUB_OUTPUT"
        echo "user-name=github-actions[bot]" >> "$GITHUB_OUTPUT"
        echo "user-email=41898282+github-actions[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Configure git user
      run: |
        git config --global user.name "${{ steps.token.outputs.user-name }}"
        git config --global user.email "${{ steps.token.outputs.user-email }}"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
      shell: bash

    - name: Configure git remote
      run: |
        git remote set-url origin https://x-access-token:${{ steps.token.outputs.token }}@github.com/${{ github.repository }}
      shell: bash
